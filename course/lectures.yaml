# AC215 · MLOps & LLMOps: Production AI Systems (Harvard, Fall 2026, Pavlos Protopapas)
# Single source of truth for this repo: lectures -> tutorials -> repos -> study guides -> videos.
# Lecture numbers and titles follow the Ed lessons (course site: tutorials_demo.md, synced with Ed
# on 2026-10). `python tools/course_map.py` regenerates the map in README.md from this file;
# `tools/sync_tutorials.py` clones/pulls every repo listed under `repos:`.

course:
  name: "AC215 / E115 · MLOps & LLMOps: Production AI Systems"
  institution: Harvard University (IACS)
  instructor: Pavlos Protopapas
  term: Fall 2026
  site: https://harvard-iacs.github.io/2026-AC215/
